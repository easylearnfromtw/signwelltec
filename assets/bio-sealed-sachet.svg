 <text x="74" y="462" font-size="8.7" fill="#778E9D">展示用視覺素材，非藥物、醫囑或處方資訊。</text>
 <text x="76" y="514" font-size="9" letter-spacing="2.2" fill="#638294">READ CAREFULLY. UNDERSTAND CLEARLY.</text>
