 <text x="73" y="270" font-size="19" font-weight="700" fill="#19384D">讓醫學更容易理解</text>
 <path d="M72 286H354" stroke="#CBD6DE"/>
 <text x="73" y="310" font-size="10" fill="#647989">01 / 醫療白話文</text>
