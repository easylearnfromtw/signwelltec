name: Deploy static site to Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 3D scripts and rendering regressions
        run: |
          node --check --input-type=module < assets/js/software-drive.js
          node --check --input-type=module < assets/js/scene.js
          node --check --input-type=module < assets/js/render-loop.mjs
          node --test tests/render-loop.test.mjs tests/performance.test.mjs tests/scene-gpu.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
